# Windows builds link the C runtime statically: a fresh Windows install has no Visual C++
# runtime (vcruntime140.dll), and without this the launcher and app exit at once with
# 0xC0000135 (DLL not found). Found by running the launcher in a clean Windows 11 VM.
# Lives at the repo root because CI builds with --manifest-path from here, and cargo reads
# config from the working directory upwards.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
