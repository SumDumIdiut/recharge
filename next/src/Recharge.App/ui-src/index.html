<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recharge</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/create.css">
  <link rel="stylesheet" href="styles/community.css">
  <link rel="stylesheet" href="styles/profile.css">
  <link rel="stylesheet" href="styles/skins.css">
  <link rel="stylesheet" href="styles/updates.css">
  <link rel="stylesheet" href="styles/amp.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/home" title="Recharge">
        <img src="assets/logo.png" alt="" width="32" height="32">
        <span class="brand-name">RECHARGE</span>
      </a>
      <nav id="sidebar-nav" class="nav-list"></nav>
      <div class="sidebar-foot">
        <nav id="sidebar-settings" class="nav-list"></nav>
        <button id="sidebar-toggle" type="button" aria-label="Collapse sidebar"><span class="toggle-label">Collapse</span></button>
      </div>
    </aside>
    <div id="main-col">
      <header id="topbar">
        <label class="search">
          <svg class="search-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search-input" type="search" placeholder="Search everything…" autocomplete="off" spellcheck="false" aria-label="Search">
          <kbd>Ctrl+K</kbd>
        </label>
        <div class="topbar-spacer"></div>
        <button id="topbar-bell" class="icon-btn" type="button" title="Notifications" aria-label="Notifications"></button>
        <button id="topbar-account" type="button" title="Log in"></button>
      </header>
      <main id="page" tabindex="-1"></main>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
