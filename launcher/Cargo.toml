[package]
name = "recharge-launcher"
version = "0.1.0"
edition = "2021"
description = "One-file Recharge launcher: installs, updates (staged, hash-verified, rollback) and starts the app"

[[bin]]
name = "recharge-launcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3.4.0"
dirs = "6"

[features]
# Linux progress window (tao links GTK3 at load time, so off by default; Linux falls back to zenity).
window = ["dep:tao", "dep:softbuffer"]

[target.'cfg(not(windows))'.dependencies]
tao = { optional = true, version = "0.35", default-features = false, features = ["rwh_06", "x11"] }
softbuffer = { optional = true, version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

[target.'cfg(windows)'.dependencies]
tao = { version = "0.35", default-features = false, features = ["rwh_06", "x11"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Com", "Win32_Security"] }


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
