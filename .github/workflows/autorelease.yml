name: Auto release

# Screens, the loader and Navigator's mod source reach everyone live, no
# package needed. The compiled backend can't be live-updated, so this builds
# and publishes it automatically whenever app/src-tauri changes - master gets
# a normal (stable) release, dev gets a prerelease (beta). The app compares
# its own build against a release's SOURCE_SHA.txt to detect an update, then
# installs and relaunches itself with no user action needed.
on:
  workflow_dispatch:
  push:
    branches: [master, dev]
    paths:
      - 'app/src-tauri/**'

concurrency:
  group: autorelease-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = dev ]; then
            base=$(python3 -c "import json; print(json.load(open('app/src/version.json'))['version'])")
            build=$(python3 -c "import json; print(json.load(open('app/src/beta.json'))['build'])")
            version="$base-beta.$build"
            echo "tag=beta-$build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            version=$(python3 -c "import json; print(json.load(open('app/src/version.json'))['version'])")
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Create the draft here so the two platform builds below can't race to create it themselves.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          flag=""
          [ "$PRERELEASE" = true ] && flag="--prerelease"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" --draft $flag \
              --title "Recharge $TAG" --target "${{ github.sha }}" --notes ""

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb'
          - platform: windows-latest
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Not committed - just stamps this build's own files.
      - name: Stamp the version
        shell: bash
        env:
          NEW: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E '4s/"version": *"[^"]*"/"version": "'"$NEW"'"/' app/package.json app/src-tauri/tauri.conf.json
          sed -i -E '3s/^version = ".*"/version = "'"$NEW"'"/' app/src-tauri/Cargo.toml
          perl -0pi -e 's/(name = "recharge"\nversion = ")[^"]*"/$1$ENV{NEW}"/' app/src-tauri/Cargo.lock

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # --tool-path installs a shim + nested .store/, not the flat DLL folder
      # build-loader.ps1 expects, so the real files get copied up from there.
      - name: Install ilspycmd (bundled decompiler tool)
        shell: bash
        run: |
          dotnet tool install ilspycmd --tool-path .ilspycmd-install-tmp
          mkdir -p loader/tools/ilspycmd
          src=$(dirname "$(find .ilspycmd-install-tmp/.store -name ilspycmd.dll)")
          cp -r "$src"/* loader/tools/ilspycmd/
          rm -rf .ilspycmd-install-tmp

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Build and attach to a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECHARGE_BUILD_SHA: ${{ github.sha }}
        with:
          projectPath: app
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Recharge ${{ needs.prepare.outputs.tag }}'
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

  publish:
    # Only once both platforms are attached, so the updater never sees a
    # release that is missing its own platform's package.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          set -euo pipefail
          echo -n "$GITHUB_SHA" > SOURCE_SHA.txt
          gh release upload "$TAG" SOURCE_SHA.txt --repo "${{ github.repository }}" --clobber
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest="$LATEST"
