name: Auto release

# Rebuilds and republishes the backend in place to one of two permanent releases ("latest"/"latest-beta") on every app/src-tauri change - no new release ever appears on the page.
# Switched off (manual only): the Recharge launcher now updates everything from the update hub
# (update-hub.yml), and GitHub releases are no longer used.
on:
  workflow_dispatch:

concurrency:
  group: autorelease-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = dev ]; then
            base=$(python3 -c "import json; print(json.load(open('app/src/version.json'))['version'])")
            build=$(python3 -c "import json; print(json.load(open('app/src/beta.json'))['build'])")
            version="$base-beta.$build"
            echo "tag=latest-beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            version=$(python3 -c "import json; print(json.load(open('app/src/version.json'))['version'])")
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Created once ever per tag, then reused - drafted so the two builds below can't race to create it.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          flag=""
          channel="stable"
          [ "$PRERELEASE" = true ] && { flag="--prerelease"; channel="beta"; }
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" --draft $flag \
              --title "Recharge ($channel)" --target "${{ github.sha }}" \
              --notes "Always the newest $channel build - this release is reused in place, never replaced by a new one."

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb'
          - platform: windows-latest
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Not committed - just stamps this build's own files.
      - name: Stamp the version
        shell: bash
        env:
          NEW: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E '4s/"version": *"[^"]*"/"version": "'"$NEW"'"/' app/package.json app/src-tauri/tauri.conf.json
          sed -i -E '3s/^version = ".*"/version = "'"$NEW"'"/' app/src-tauri/Cargo.toml
          perl -0pi -e 's/(name = "recharge"\nversion = ")[^"]*"/$1$ENV{NEW}"/' app/src-tauri/Cargo.lock

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # --tool-path installs a shim + nested .store/, not the flat DLL folder
      # build-loader.ps1 expects, so the real files get copied up from there.
      - name: Install ilspycmd (bundled decompiler tool)
        shell: bash
        run: |
          dotnet tool install ilspycmd --tool-path .ilspycmd-install-tmp
          mkdir -p loader/tools/ilspycmd
          src=$(dirname "$(find .ilspycmd-install-tmp/.store -name ilspycmd.dll)")
          cp -r "$src"/* loader/tools/ilspycmd/
          rm -rf .ilspycmd-install-tmp

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Build and attach to the permanent release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECHARGE_BUILD_SHA: ${{ github.sha }}
        with:
          projectPath: app
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Recharge v${{ needs.prepare.outputs.version }}'
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

  publish:
    # Only once both platforms are attached, so the updater never sees a
    # release that is missing its own platform's package.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          set -euo pipefail
          echo -n "$GITHUB_SHA" > SOURCE_SHA.txt
          echo -n "$VERSION" > VERSION.txt
          gh release upload "$TAG" SOURCE_SHA.txt VERSION.txt --repo "${{ github.repository }}" --clobber

          # Filenames are versioned, not clobbered by name, so old ones pile up unless pruned - keep only the newest per type.
          # The dot is matched as [.] rather than \. : gh's jq takes the pattern as a string, where a
          # backslash is an invalid escape - that parse error failed the whole publish step.
          for pattern in '-setup[.]exe$' '[.]deb$'; do
            gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
              --jq "[.assets[] | select(.name | test(\"$pattern\"))] | sort_by(.createdAt) | .[:-1][].name" |
            while IFS= read -r name; do
              [ -n "$name" ] && gh release delete-asset "$TAG" "$name" --repo "${{ github.repository }}" -y
            done
          done

          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest="$LATEST"
