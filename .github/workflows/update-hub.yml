name: Publish to update hub

# Builds the launcher + app for windows-x64 and linux-x64, assembles the platform dirs
# (tools/build-update-dir.*) and publishes them to the Recharge update hub with
# tools/publish-update.mjs. master -> stable channel, dev -> beta channel.
#
# Runs alongside the legacy autorelease.yml / release.yml (GitHub releases + installers), which stay
# until every install has migrated to the launcher.
#
# REQUIRED REPO SECRET:  UPDATE_KEY   - must equal the UPDATE_KEY env var of the hub (recharge-hub).
# Optional repo variable: UPDATE_BASE - hub base URL, default https://codecade.co.za/recharge
#
# The launcher binary is only published when launcher/** changed (clients replace their launcher
# whenever its hash differs, so republishing a rebuild every time would churn every install), or
# when this workflow is started by hand with "launcher" ticked (needed for the very first publish).
on:
  workflow_dispatch:
    inputs:
      launcher:
        description: 'Also publish the launcher binaries'
        type: boolean
        default: false
  push:
    branches: [master, dev]
    paths:
      - 'app/**'
      - 'loader/**'
      - 'electron/**'
      - 'content/**'
      - 'launcher/**'
      - 'tools/publish-update.mjs'
      - 'tools/build-update-dir.*'
      - '.github/workflows/update-hub.yml'

# One publish at a time per channel; a newer push supersedes a running one.
concurrency:
  group: update-hub-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.v.outputs.channel }}
      version: ${{ steps.v.outputs.version }}
      api_level: ${{ steps.v.outputs.api_level }}
      launcher_version: ${{ steps.v.outputs.launcher_version }}
      publish_launcher: ${{ steps.v.outputs.publish_launcher }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: v
        env:
          BEFORE: ${{ github.event.before }}
          DISPATCH_LAUNCHER: ${{ github.event.inputs.launcher }}
        run: |
          set -euo pipefail
          base=$(python3 -c "import json; print(json.load(open('app/src/version.json'))['version'])")
          if [ "${{ github.ref_name }}" = dev ]; then
            channel=beta
            build=$(python3 -c "import json; print(json.load(open('app/src/beta.json'))['build'])")
            version="$base-beta.$build"
          elif [ "${{ github.ref_name }}" = master ]; then
            channel=stable
            version="$base"
          else
            echo "only master and dev publish (ref ${{ github.ref_name }})" >&2; exit 1
          fi
          api=$(python3 -c "import json; print(json.load(open('app/live.json'))['apiLevel'])")
          lv=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)
          pub=false
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            [ "$DISPATCH_LAUNCHER" = true ] && pub=true
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" -- launcher/ 2>/dev/null | grep -q .; then
            pub=true
          elif ! git cat-file -e "$BEFORE" 2>/dev/null; then
            pub=true   # first push of a branch / unknown base: be safe
          fi
          { echo "channel=$channel"; echo "version=$version"; echo "api_level=$api"; echo "launcher_version=$lv"; echo "publish_launcher=$pub"; } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux-x64
          - platform: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version
        shell: bash
        env:
          NEW: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E '4s/"version": *"[^"]*"/"version": "'"$NEW"'"/' app/package.json app/src-tauri/tauri.conf.json
          sed -i -E '3s/^version = ".*"/version = "'"$NEW"'"/' app/src-tauri/Cargo.toml
          perl -0pi -e 's/(name = "recharge"\nversion = ")[^"]*"/$1$ENV{NEW}"/' app/src-tauri/Cargo.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc   # no-op on the Windows runner, keeps the step identical

      - name: Install Linux build dependencies
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ilspycmd (bundled decompiler tool)
        shell: bash
        run: |
          dotnet tool install ilspycmd --tool-path .ilspycmd-install-tmp
          mkdir -p loader/tools/ilspycmd
          src=$(dirname "$(find .ilspycmd-install-tmp/.store -name ilspycmd.dll)")
          cp -r "$src"/* loader/tools/ilspycmd/
          rm -rf .ilspycmd-install-tmp

      # The Windows code (registry, shortcuts, uninstaller) compiles for the first time here: the
      # checks run before the long release builds so a failure shows up early.
      - name: Check Windows target (launcher; the app's release build below is the real compile)
        if: matrix.name == 'windows-x64'
        shell: bash
        run: |
          cargo check --manifest-path launcher/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build the launcher
        shell: bash
        run: cargo build --release --manifest-path launcher/Cargo.toml

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Build the app (no installer bundle)
        working-directory: app
        shell: bash
        env:
          RECHARGE_BUILD_SHA: ${{ github.sha }}
        run: npm run tauri build -- --no-bundle

      - name: Assemble the platform dir (Linux)
        if: matrix.name == 'linux-x64'
        run: |
          tools/build-update-dir.sh --platform linux-x64 --out dist/linux-x64
          # tar keeps the exec bits through the artifact upload
          tar -C dist -czf dist/linux-x64.tar.gz linux-x64
          mkdir -p dist/launcher
          cp launcher/target/release/recharge-launcher dist/launcher/recharge

      - name: Assemble the platform dir (Windows)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          tools/build-update-dir.ps1 -Platform windows-x64 -Out dist/windows-x64
          New-Item -ItemType Directory -Force dist/launcher | Out-Null
          Copy-Item launcher/target/release/recharge-launcher.exe dist/launcher/Recharge.exe
          Compress-Archive -Path dist/windows-x64 -DestinationPath dist/windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.name }}
          path: |
            dist/linux-x64.tar.gz
            dist/windows-x64.zip
            dist/launcher/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true

      - name: Unpack
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C dist -xzf art/linux-x64.tar.gz
          unzip -q art/windows-x64.zip -d dist
          ls -R art | head -20

      - name: Publish
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          API_LEVEL: ${{ needs.prepare.outputs.api_level }}
          LAUNCHER_VERSION: ${{ needs.prepare.outputs.launcher_version }}
          PUBLISH_LAUNCHER: ${{ needs.prepare.outputs.publish_launcher }}
          BASE: ${{ vars.UPDATE_BASE || 'https://codecade.co.za/recharge' }}
        run: |
          set -euo pipefail
          [ -n "$UPDATE_KEY" ] || { echo "repo secret UPDATE_KEY is not set" >&2; exit 1; }
          extra=()
          if [ "$PUBLISH_LAUNCHER" = true ]; then
            chmod +x art/launcher/recharge
            extra=(--launcher "windows-x64=art/launcher/Recharge.exe" --launcher "linux-x64=art/launcher/recharge" --launcher-version "$LAUNCHER_VERSION")
          fi
          # --build is the run number of this workflow: global and unique across both channels.
          node tools/publish-update.mjs --base "$BASE" --channel "$CHANNEL" --version "$VERSION" \
            --build "${{ github.run_number }}" --api-level "$API_LEVEL" \
            --platform windows-x64=dist/windows-x64 --platform linux-x64=dist/linux-x64 \
            "${extra[@]}"
