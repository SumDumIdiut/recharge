name: Publish to update hub

# Builds the app for windows-x64 and linux-x64 and publishes it to the update hub with tools/publish-update.mjs. master -> stable, dev -> beta.
#   master (stable): the old Tauri app (tools/build-update-dir.*), unchanged.
#   dev (beta):      Recharge, the .NET rewrite whose source lives in next/ (synced from the recharge-next tree by its tools/sync-to-recharge.sh):
#                    dotnet publish self-contained for each platform + the built UI, assembled by tools/build-next-dir.sh. Its manifest version is
#                    the csproj Version without a trailing ".0" (0.1.0 -> "0.1"); the build number is this workflow's run number, as always.
# Note for the launcher: a beta install takes whichever of the beta and stable manifests has the HIGHER build number, so a later master (old app) publish outranks the newest dev
# (Recharge) build until dev is published again.
#
# Runs alongside the legacy autorelease.yml / release.yml until every install has migrated to the launcher.
#
# REQUIRED REPO SECRET:  UPDATE_KEY   - must equal the UPDATE_KEY env var of the hub (recharge-hub).
# Optional repo variable: UPDATE_BASE - hub base URL, default https://codecade.co.za/recharge
#
# The launcher binary is only published when launcher/** changed (clients replace theirs whenever its hash differs) or when started by hand with "launcher" ticked (first publish).
on:
  workflow_dispatch:
    inputs:
      launcher:
        description: 'Also publish the launcher binaries'
        type: boolean
        default: false
  push:
    branches: [master, dev]
    paths:
      - 'app/**'
      # Amplifier-only pushes are published by amp-hub.yml and must not cut a Recharge version. GitHub evaluates paths
      # patterns in order, a later "!" pattern un-matches files an earlier pattern matched; the push runs only if at
      # least one changed file still matches. So a push touching only app/src/maps/** is skipped, while one that also
      # touches anything else under app/** (or loader/, ...) still runs. Keep this "!" line right after 'app/**'.
      - '!app/src/maps/**'
      - 'loader/**'
      - 'electron/**'
      - 'next/**'
      - 'content/**'
      - 'launcher/**'
      - 'tools/publish-update.mjs'
      - 'tools/build-update-dir.*'
      - 'tools/build-next-dir.sh'
      - '.github/workflows/update-hub.yml'

# One publish at a time per channel; a newer push supersedes a running one.
concurrency:
  group: update-hub-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.v.outputs.channel }}
      version: ${{ steps.v.outputs.version }}
      api_level: ${{ steps.v.outputs.api_level }}
      launcher_version: ${{ steps.v.outputs.launcher_version }}
      product: ${{ steps.v.outputs.product }}
      publish_launcher: ${{ steps.v.outputs.publish_launcher }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: v
        env:
          BEFORE: ${{ github.event.before }}
          DISPATCH_LAUNCHER: ${{ github.event.inputs.launcher }}
        run: |
          set -euo pipefail
          base=$(python3 -c "import json; print(json.load(open('app/src/version.json'))['version'])")
          product=app
          if [ "${{ github.ref_name }}" = dev ]; then
            channel=beta
            product=next
            # Recharge: the csproj Version, "0.1.0" published as "0.1".
            version=$(python3 - <<'PY'
          import re
          v = re.search(r'<Version>([^<]+)</Version>', open('next/src/Recharge.App/Recharge.App.csproj').read()).group(1).strip()
          print(re.sub(r'^(\d+\.\d+)\.0$', r'\1', v))
          PY
            )
            [ -n "$version" ] || { echo "no Version in next/src/Recharge.App/Recharge.App.csproj" >&2; exit 1; }
          elif [ "${{ github.ref_name }}" = master ]; then
            channel=stable
            version="$base"
          else
            echo "only master and dev publish (ref ${{ github.ref_name }})" >&2; exit 1
          fi
          api=$(python3 -c "import json; print(json.load(open('app/live.json'))['apiLevel'])")
          lv=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)
          pub=false
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            [ "$DISPATCH_LAUNCHER" = true ] && pub=true
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" -- launcher/ 2>/dev/null | grep -q .; then
            pub=true
          elif ! git cat-file -e "$BEFORE" 2>/dev/null; then
            pub=true   # first push of a branch / unknown base: be safe
          fi
          { echo "channel=$channel"; echo "version=$version"; echo "api_level=$api"; echo "launcher_version=$lv"; echo "publish_launcher=$pub"; echo "product=$product"; } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Old app (master/stable).
  build:
    needs: prepare
    if: needs.prepare.outputs.product == 'app'
    strategy:
      # Each platform runs to the end so one failure doesn't hide the other's result (publish still needs both).
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux-x64
          - platform: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version
        shell: bash
        env:
          NEW: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E '4s/"version": *"[^"]*"/"version": "'"$NEW"'"/' app/package.json app/src-tauri/tauri.conf.json
          sed -i -E '3s/^version = ".*"/version = "'"$NEW"'"/' app/src-tauri/Cargo.toml
          perl -0pi -e 's/(name = "recharge"\nversion = ")[^"]*"/$1$ENV{NEW}"/' app/src-tauri/Cargo.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc   # no-op on the Windows runner, keeps the step identical

      - name: Install Linux build dependencies
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ilspycmd (bundled decompiler tool)
        shell: bash
        run: |
          dotnet tool install ilspycmd --version 11.1.0.9782 --tool-path .ilspycmd-install-tmp  # pinned: 11.2 changed the package layout and broke the copy below
          mkdir -p loader/tools/ilspycmd
          dll=$(find .ilspycmd-install-tmp/.store -name ilspycmd.dll | head -1)
          [ -n "$dll" ] || { echo "ilspycmd.dll not found in the installed tool" >&2; exit 1; }
          src=$(dirname "$dll")
          cp -r "$src"/* loader/tools/ilspycmd/
          rm -rf .ilspycmd-install-tmp

      # The Windows code (registry, shortcuts, uninstaller) first compiles here: run the checks before the long release builds.
      - name: Check Windows target (launcher; the app's release build below is the real compile)
        if: matrix.name == 'windows-x64'
        shell: bash
        run: |
          cargo check --manifest-path launcher/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build the launcher
        shell: bash
        run: cargo build --release --manifest-path launcher/Cargo.toml

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Build the app (no installer bundle)
        working-directory: app
        shell: bash
        env:
          RECHARGE_BUILD_SHA: ${{ github.sha }}
        run: npm run tauri build -- --no-bundle

      - name: Assemble the platform dir (Linux)
        if: matrix.name == 'linux-x64'
        run: |
          bash tools/build-update-dir.sh --platform linux-x64 --out dist/linux-x64
          # tar keeps the exec bits through the artifact upload
          tar -C dist -czf dist/linux-x64.tar.gz linux-x64
          mkdir -p dist/launcher
          cp launcher/target/release/recharge-launcher dist/launcher/recharge

      - name: Assemble the platform dir (Windows)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          tools/build-update-dir.ps1 -Platform windows-x64 -Out dist/windows-x64
          New-Item -ItemType Directory -Force dist/launcher | Out-Null
          Copy-Item launcher/target/release/recharge-launcher.exe dist/launcher/Recharge.exe
          Compress-Archive -Path dist/windows-x64 -DestinationPath dist/windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.name }}
          path: |
            dist/linux-x64.tar.gz
            dist/windows-x64.zip
            dist/launcher/*
          if-no-files-found: error

  # Recharge (dev/beta): next/ is the recharge-next source tree.
  build-next:
    needs: prepare
    if: needs.prepare.outputs.product == 'next'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux-x64
            rid: linux-x64
          - platform: windows-latest
            name: windows-x64
            rid: win-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the UI
        shell: bash
        run: node next/tools/build-ui.mjs

      - name: Publish the app
        shell: bash
        run: |
          dotnet publish next/src/Recharge.App -c Release -r ${{ matrix.rid }} --self-contained -p:NuGetAudit=false -o next/publish/${{ matrix.name }}

      - name: Assemble the platform dir
        shell: bash
        run: bash tools/build-next-dir.sh --platform ${{ matrix.name }} --publish next/publish/${{ matrix.name }} --out dist/${{ matrix.name }}

      - name: Package (Linux)
        if: matrix.name == 'linux-x64'
        run: |
          # tar keeps the exec bits through the artifact upload
          tar -C dist -czf dist/linux-x64.tar.gz linux-x64

      - name: Package (Windows)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: Compress-Archive -Path dist/windows-x64 -DestinationPath dist/windows-x64.zip

      # The launcher binary ships only when launcher/** changed (see prepare); the old job's cargo build is not run here.
      - uses: dtolnay/rust-toolchain@stable
        if: needs.prepare.outputs.publish_launcher == 'true'

      - name: Build the launcher
        if: needs.prepare.outputs.publish_launcher == 'true'
        shell: bash
        run: |
          cargo build --release --manifest-path launcher/Cargo.toml
          mkdir -p dist/launcher
          if [ "${{ matrix.name }}" = windows-x64 ]; then cp launcher/target/release/recharge-launcher.exe dist/launcher/Recharge.exe
          else cp launcher/target/release/recharge-launcher dist/launcher/recharge; fi

      - uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.name }}
          path: |
            dist/linux-x64.tar.gz
            dist/windows-x64.zip
            dist/launcher/*
          if-no-files-found: error

  publish:
    needs: [prepare, build, build-next]
    # Whichever build job ran must have succeeded; the other one is skipped.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build.result != 'failure' && needs.build-next.result != 'failure' && (needs.build.result == 'success' || needs.build-next.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the changelog is the commit subjects since the last publish
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true

      - name: Unpack
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C dist -xzf art/linux-x64.tar.gz
          unzip -q art/windows-x64.zip -d dist
          ls -R art | head -20

      - name: Publish
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          API_LEVEL: ${{ needs.prepare.outputs.api_level }}
          LAUNCHER_VERSION: ${{ needs.prepare.outputs.launcher_version }}
          PUBLISH_LAUNCHER: ${{ needs.prepare.outputs.publish_launcher }}
          BASE: ${{ vars.UPDATE_BASE || 'https://codecade.co.za/recharge' }}
        run: |
          set -euo pipefail
          [ -n "$UPDATE_KEY" ] || { echo "repo secret UPDATE_KEY is not set" >&2; exit 1; }
          # Changelog: commit subjects since this channel's last published commit (from the live manifest), else the last 15; merges, bumps and promotions are dropped, duplicates listed once.
          prev=$(curl -fsS --max-time 20 "$BASE/update/$CHANNEL/manifest.json" 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true)
          if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null && [ "$prev" != "$GITHUB_SHA" ]; then
            range="$prev..$GITHUB_SHA"
          else
            range="-n 15 $GITHUB_SHA"
          fi
          # shellcheck disable=SC2086
          git log --format=%s $range \
            | grep -Ev '^(Merge |Version bump for the promotion|Promote dev to stable|Beta build [0-9]+)' \
            | awk '!seen[$0]++' \
            | head -n 100 > changes.txt || true
          echo "changelog ($range):"; cat changes.txt
          extra=()
          if [ "$PUBLISH_LAUNCHER" = true ]; then
            chmod +x art/launcher/recharge
            extra=(--launcher "windows-x64=art/launcher/Recharge.exe" --launcher "linux-x64=art/launcher/recharge" --launcher-version "$LAUNCHER_VERSION")
          fi
          # --build is the run number of this workflow: global and unique across both channels.
          node tools/publish-update.mjs --base "$BASE" --channel "$CHANNEL" --version "$VERSION" \
            --build "${{ github.run_number }}" --api-level "$API_LEVEL" \
            --commit "$GITHUB_SHA" --changes-file changes.txt \
            --platform windows-x64=dist/windows-x64 --platform linux-x64=dist/linux-x64 \
            "${extra[@]}"
