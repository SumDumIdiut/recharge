name: Bootstrap installer

# Builds the tiny version-independent installer (it always downloads the
# newest Recharge release) and attaches it to a permanent "installer"
# release, so its download link never changes. Runs only when the
# bootstrap sources change - not per Recharge release.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'installer/bootstrap/**'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build RechargeSetup.exe
        working-directory: installer/bootstrap
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" RechargeSetup.nsi
          if (-not (Test-Path RechargeSetup.exe)) { throw 'makensis did not produce RechargeSetup.exe' }

      - name: Publish to the "installer" release
        working-directory: installer/bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Windows checkout may have turned install.sh into CRLF, which bash rejects.
          sed -i 's/\r$//' install.sh
          # --latest=false keeps GitHub's /releases/latest (used by the app's
          # update check and these installers) pointing at the app release.
          gh release view installer >/dev/null 2>&1 || gh release create installer \
            --latest=false --target "${{ github.sha }}" --title "Installers" \
            --notes "Permanent, version-independent installers - they always install the newest Recharge release. Download RechargeSetup.exe on Windows, or run install.sh on Linux."
          gh release upload installer RechargeSetup.exe install.sh install.ps1 --clobber
