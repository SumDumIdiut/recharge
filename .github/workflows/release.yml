name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb'
          - platform: windows-latest
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # --tool-path installs a shim + nested .store/, not the flat DLL folder
      # build-loader.ps1 expects, so the real files get copied up from there.
      - name: Install ilspycmd (bundled decompiler tool)
        shell: bash
        run: |
          dotnet tool install ilspycmd --tool-path .ilspycmd-install-tmp
          mkdir -p loader/tools/ilspycmd
          src=$(dirname "$(find .ilspycmd-install-tmp/.store -name ilspycmd.dll)")
          cp -r "$src"/* loader/tools/ilspycmd/
          rm -rf .ilspycmd-install-tmp

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: 'Recharge ${{ github.ref_name }}'
          releaseBody: See the assets below to download this version.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
