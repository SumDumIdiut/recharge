<main class="page">
  <div id="mods-list">
    <div class="page-header">Mods</div>

    <div class="browser-toolbar">
      <div class="browser-subtabs">
        <button class="subtab-btn active" data-subtab="installed" onclick="window.__modsSubtab('installed')">Installed</button>
        <button class="subtab-btn" data-subtab="browse" onclick="window.__modsSubtab('browse')">Browse</button>
        <button class="subtab-btn" onclick="window.__modExportExample()">Export Example Mod</button>
        <button class="subtab-btn" id="mods-upload-btn" onclick="window.__modOpenUpload()">Upload</button>
      </div>
      <input class="browser-search" id="mods-search" type="text" placeholder="Search mods…" oninput="window.__modsSearch(this.value)" />
    </div>

    <div id="mods-installed-view" class="browser-grid"></div>
    <div id="mods-browse-view" class="browser-grid" style="display:none;"></div>
  </div>

  <div id="mods-detail" style="display:none;"></div>
</main>

<div class="modal-overlay" id="mods-dep-overlay" hidden>
  <div class="modal">
    <div class="modal-title" id="mods-dep-title">Additional Mods Required</div>
    <div class="modal-body" id="mods-dep-body"></div>
    <div class="modal-actions">
      <button class="btn" id="mods-dep-cancel">Cancel</button>
      <button class="btn btn-primary" id="mods-dep-confirm">Install All</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="mods-upload-overlay" hidden>
  <div class="modal">
    <div class="modal-title">Upload a Mod</div>
    <div class="modal-body">
      <label class="form-field">
        Mod folder
        <div class="form-browse-row">
          <span class="form-browse-path" id="mods-upload-path">No folder chosen</span>
          <button class="btn" id="mods-upload-browse-btn" type="button">Browse…</button>
        </div>
      </label>
      <label class="form-field">
        Name
        <input class="form-input" id="mods-upload-name" type="text" placeholder="e.g. Icy Physics" />
      </label>
      <label class="form-field">
        Description
        <textarea class="form-input" id="mods-upload-description" rows="3" style="resize: vertical; font: inherit;" placeholder="Optional"></textarea>
      </label>
      <label class="form-field">
        Screenshots
        <div class="form-browse-row">
          <span class="form-browse-path" id="mods-upload-gallery-path">None chosen (optional, up to 8)</span>
          <button class="btn" id="mods-upload-gallery-btn" type="button">Browse…</button>
        </div>
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn" id="mods-upload-cancel">Cancel</button>
      <button class="btn btn-primary" id="mods-upload-confirm">Upload</button>
    </div>
  </div>
</div>
