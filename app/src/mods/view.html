<main class="page">
  <div id="mods-list">
    <div class="page-header">Mods</div>

    <div class="browser-toolbar">
      <div class="browser-subtabs">
        <button class="subtab-btn active" data-subtab="installed" onclick="window.__modsSubtab('installed')">Installed</button>
        <button class="subtab-btn" data-subtab="browse" onclick="window.__modsSubtab('browse')">Browse</button>
      </div>
      <input class="browser-search" id="mods-search" type="text" placeholder="Search mods…" oninput="window.__modsSearch(this.value)" />
    </div>

    <div id="mods-installed-view" class="browser-grid"></div>
    <div id="mods-browse-view" class="browser-grid" style="display:none;"></div>
  </div>

  <div id="mods-detail" style="display:none;"></div>
</main>

<div class="mods-modal-overlay" id="mods-dep-overlay" hidden>
  <div class="mods-modal">
    <div class="mods-modal-title" id="mods-dep-title">Additional Mods Required</div>
    <div class="mods-modal-body" id="mods-dep-body"></div>
    <div class="mods-modal-actions">
      <button class="btn" id="mods-dep-cancel">Cancel</button>
      <button class="btn btn-primary" id="mods-dep-confirm">Install All</button>
    </div>
  </div>
</div>
