<main class="page mod-page">
  <div class="page-header">Moderators</div>
  <!-- One flat room, open as soon as the page lands. The hub turns anyone who is not a
       moderator away, so this page is only reachable for them. -->
  <section class="modchat" id="modchat">
    <div class="modchat-log" id="modchat-log"></div>
    <form class="modchat-form" id="modchat-form">
      <input id="modchat-input" type="text" maxlength="500" autocomplete="off" placeholder="Message the moderators" />
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </section>
</main>
