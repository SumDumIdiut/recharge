<main class="page">
  <div class="page-header">Maps</div>

  <div class="browser-toolbar">
    <div class="browser-subtabs">
      <button class="subtab-btn active" data-subtab="installed" onclick="window.__mapsSubtab('installed')">Installed</button>
      <button class="subtab-btn" data-subtab="browse" onclick="window.__mapsSubtab('browse')">Browse</button>
      <button class="subtab-btn" data-subtab="create" onclick="window.__mapsSubtab('create')">Create</button>
      <button class="subtab-btn" id="maps-upload-btn" onclick="window.__mapOpenUpload()" style="display:none;">Upload</button>
    </div>
    <input class="browser-search" id="maps-search" type="text" placeholder="Search maps…" oninput="window.__mapsSearch(this.value)" />
  </div>

  <div id="maps-installed-view" class="browser-grid"></div>
  <div id="maps-browse-view" class="browser-grid" style="display:none;"></div>
  <div id="maps-create-view" class="map-maker" style="display:none;"></div>
</main>

<div class="modal-overlay" id="maps-upload-overlay" hidden>
  <div class="modal">
    <div class="modal-title">Upload a Map</div>
    <div class="modal-body">
      <label class="form-field">
        Map file
        <div class="form-browse-row">
          <span class="form-browse-path" id="maps-upload-path">No file chosen</span>
          <button class="btn" id="maps-upload-browse-btn" type="button">Browse…</button>
        </div>
      </label>
      <label class="form-field">
        Name
        <input class="form-input" id="maps-upload-name" type="text" placeholder="e.g. Death by Lolo" />
      </label>
      <label class="form-field">
        Description
        <input class="form-input" id="maps-upload-description" type="text" placeholder="Optional" />
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn" id="maps-upload-cancel">Cancel</button>
      <button class="btn btn-primary" id="maps-upload-confirm">Upload</button>
    </div>
  </div>
</div>
