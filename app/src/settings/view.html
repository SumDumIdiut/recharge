<main class="page">
  <div class="page-header">Settings</div>

  <div class="card">
    <div class="settings-label">Appearance</div>
    <div class="theme-presets" id="theme-presets"></div>
    <div class="theme-colors" id="theme-colors"></div>

    <div class="settings-sublabel">Background texture</div>
    <div class="texture-row">
      <div class="texture-preview" id="texture-preview"></div>
      <div class="texture-actions">
        <label class="btn" for="texture-input">Upload image…</label>
        <input type="file" id="texture-input" accept="image/*" hidden />
        <button class="btn" id="texture-remove-btn" hidden>Remove</button>
      </div>
    </div>
    <div class="settings-error" id="texture-error" hidden></div>

    <div class="settings-sublabel">Waveform</div>
    <div class="settings-row">
      <label class="color-field" style="flex-direction: row; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="wave-enabled" />
        Show waveform banner
      </label>
    </div>
    <div class="wave-sliders" id="wave-sliders">
      <label class="wave-slider-row">
        Speed
        <input type="range" id="wave-speed" min="20" max="220" step="5" />
      </label>
      <label class="wave-slider-row">
        Height
        <input type="range" id="wave-amplitude" min="4" max="40" step="1" />
      </label>
      <label class="wave-slider-row">
        Density
        <input type="range" id="wave-density" min="120" max="500" step="10" />
      </label>
    </div>

    <div class="settings-sublabel">Custom CSS</div>
    <div class="css-row">
      <label class="btn" for="css-file-input">Upload .css file…</label>
      <input type="file" id="css-file-input" accept=".css,text/css" hidden />
      <button class="btn" id="css-clear-btn">Clear</button>
    </div>
    <textarea class="css-textarea" id="custom-css-textarea" placeholder="/* Paste or upload custom CSS - applied live, overrides everything above */" spellcheck="false"></textarea>
    <div class="settings-error" id="css-error" hidden></div>
  </div>

  <div class="card">
    <div class="settings-label">Recharge</div>
    <div class="settings-row">
      <div id="launcher-status" class="settings-sub">Checking…</div>
    </div>
    <div id="launcher-notes" class="settings-sub" hidden></div>
  </div>

  <div class="card">
    <div class="settings-label">Game install path</div>
    <div class="settings-row">
      <input class="settings-input" id="settings-game-path" type="text" placeholder="Auto-detected" readonly />
      <button class="btn" onclick="window.__settingsBrowse()">Browse…</button>
    </div>
  </div>

  <div class="card">
    <div class="settings-label">RechargeLoader</div>
    <div class="settings-row">
      <div id="loader-status" class="settings-sub">Checking…</div>
      <button class="btn btn-primary" id="loader-install-btn" onclick="window.__loaderInstall()">Install / Update</button>
    </div>
    <div class="progress-track" id="loader-progress-track" hidden>
      <div class="progress-fill" id="loader-progress-fill"></div>
    </div>
    <div id="loader-progress" class="settings-sub"></div>
  </div>
</main>
