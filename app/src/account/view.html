<main class="page">
  <div class="page-header">Account</div>

  <div class="card" id="account-profile"><div class="empty-state">Loading...</div></div>
  <div class="page-header account-sub-header" id="account-uploads-header">My Uploads</div>
  <div class="browser-subtabs" id="account-uploads-switch" style="display:none; margin-bottom:12px;">
    <button class="subtab-btn active" data-scope="mine" onclick="window.__acctScope('mine')">Mine</button>
    <button class="subtab-btn" data-scope="all" onclick="window.__acctScope('all')">Everyone</button>
  </div>
  <div id="account-uploads-list" class="browser-grid"></div>
</main>

<div class="modal-overlay" id="account-edit-overlay" hidden>
  <div class="modal">
    <div class="modal-title">Edit Upload</div>
    <div class="modal-body">
      <label class="form-field">
        Name
        <input class="form-input" id="account-edit-name" type="text" />
      </label>
      <label class="form-field">
        Author
        <input class="form-input" id="account-edit-author" type="text" />
      </label>
      <label class="form-field">
        Description
        <input class="form-input" id="account-edit-description" type="text" />
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn" id="account-edit-cancel">Cancel</button>
      <button class="btn btn-primary" id="account-edit-save">Save</button>
    </div>
  </div>
</div>
