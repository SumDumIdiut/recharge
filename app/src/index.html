<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recharge</title>
    <script src="/live-boot.js"></script>
    <script>
      // Applied before any CSS paints so the background texture doesn't flash in. Also drops the
      // legacy saved colours / custom CSS keys (theming was removed; theme.js clears them too).
      (function () {
        try { localStorage.removeItem('rechargeColors'); localStorage.removeItem('rechargeCustomCss'); } catch (e) {}
        try {
          var tex = localStorage.getItem('rechargeBgTexture');
          if (tex) document.documentElement.style.setProperty('--bg-image', 'url("' + tex + '")');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/components.css" />
    <link rel="stylesheet" href="/skins/style.css" />
    <link rel="stylesheet" href="/account/style.css" />
    <link rel="stylesheet" href="/settings/style.css" />
    <link rel="stylesheet" href="/backgrounds/style.css" />
    <link rel="stylesheet" href="/credits/style.css" />
    <link rel="stylesheet" href="/maps/style.css" />
    <script type="module" src="/app.js" defer></script>
  </head>
  <body>
    <div id="bg-grid"></div>

    <div class="crumb-bar" id="crumb-bar" hidden>
      <button class="crumb-back" onclick="goHome()">
        Main Menu
      </button>
    </div>

    <div class="view v-on" id="view-home">
      <div class="home-page">
        <div class="home-header">
          <div class="home-title-row">
            <div class="home-title-left">
              <img class="home-logo" src="/assets/logo.png" alt="" />
              <span class="home-title">Recharge</span>
            </div>
            <div class="home-title-right">
              <a class="home-patreon-link" href="https://www.patreon.com/c/FlippedRecharger" target="_blank" rel="noopener" title="Support on Patreon">
                <svg viewBox="0 0 569 546" fill="currentColor" aria-hidden="true"><circle cx="362.59" cy="204.59" r="204.59"/><rect width="100" height="545.8"/></svg>
              </a>
              <button class="home-account-badge" id="home-account-badge" onclick="window.__homeAccountBadgeClick()">Log In</button>
            </div>
          </div>
          <div id="wave-banner">
            <svg height="44" class="wave-trace">
              <polyline fill="none" />
            </svg>
          </div>
        </div>

        <div class="home-grid">
          <div class="home-panel" style="align-self: flex-start;"> <!-- fit the content instead of stretching to the tallest panel -->
            <div class="home-panel-title">Installation</div>
            <div class="home-install-list" id="home-install-list">
              <div class="home-install-sub">Detecting…</div>
            </div>
            <div class="home-install-list" style="margin-top:6px;">
              <button class="btn" id="home-games-btn" onclick="navigate('games')" style="width:100%;">Legacy</button>
            </div>
          </div>

          <div class="home-menu-col">
            <div class="home-launch-row">
              <button class="home-tile" onclick="window.__homeLaunch('vanilla')">
                <span>&gt; Vanilla</span>
              </button>
              <button class="home-tile" id="home-modded-tile" onclick="window.__homeLaunch('modded')">
                <span>&gt; Modded</span>
              </button>
            </div>
            <div class="home-play-status" id="home-play-status"></div>
            <div class="home-install-sub" id="home-demo-note" style="display:none;">The demo only supports vanilla - mods aren't available on it.</div>

            <div class="home-menu-rows">
              <button class="home-menu-row" id="home-mods-row" onclick="navigate('mods')">
                <span>&gt; Mods</span>
              </button>
              <button class="home-menu-row" id="home-skins-row" onclick="navigate('skins')">
                <span>&gt; Skins</span>
              </button>
              <button class="home-menu-row" onclick="navigate('backgrounds')">
                <span>&gt; Backgrounds</span>
              </button>
              <button class="home-menu-row" id="home-maps-row" onclick="navigate('maps')">
                <span>&gt; Maps</span>
              </button>
              <button class="home-menu-row" id="home-amplifier-row" onclick="chooseAmplifier()">
                <span>&gt; Amplifier</span>
              </button>
              <button class="home-menu-row" onclick="navigate('settings')">
                <span>&gt; Settings</span>
              </button>
              <button class="home-menu-row" onclick="navigate('credits')">
                <span>&gt; Credits</span>
              </button>
            </div>
          </div>

          <div class="home-panel home-log-panel" style="align-self: stretch;">
            <div class="home-panel-title">What's new</div>
            <div class="home-news" id="home-news"><div class="home-install-sub">Loading…</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="view" id="view-mods"></div>
    <div class="view" id="view-maps"></div>
    <div class="view" id="view-skins"></div>
    <div class="view" id="view-games"></div>
    <div class="view" id="view-account"></div>
    <div class="view" id="view-backgrounds"></div>
    <div class="view" id="view-settings"></div>
    <div class="view" id="view-credits"></div>

    <div id="toast-container"></div>

    <button class="global-progress" id="global-progress" onclick="navigate('settings')" hidden>
      <div class="global-progress-text" id="global-progress-text"></div>
      <div class="progress-track"><div class="progress-fill" id="global-progress-fill"></div></div>
    </button>

    <div class="modal-overlay" id="onboard-overlay" hidden>
      <div class="modal">
        <div class="modal-title">Get Set Up</div>
        <div class="modal-body" id="onboard-body"></div>
        <div class="modal-actions">
          <button class="btn" id="onboard-dismiss">Not Now</button>
          <button class="btn btn-primary" id="onboard-go">Go to Settings</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="update-overlay" hidden>
      <div class="modal">
        <div class="modal-title">Update Available</div>
        <div class="modal-body" id="update-body"></div>
        <div id="update-progress" class="settings-sub" hidden></div>
        <div class="modal-actions">
          <button class="btn" id="update-later">Later</button>
          <button class="btn btn-primary" id="update-now">Update Now</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="login-overlay" hidden>
      <div class="modal">
        <div class="modal-title" id="login-title">Log In</div>
        <div class="modal-body">
          <label class="form-field">
            Username
            <input class="form-input" id="login-username" type="text" />
          </label>
          <label class="form-field">
            Password
            <input class="form-input" id="login-password" type="password" />
          </label>
          <div class="account-error" id="login-error" hidden></div>
          <button class="account-toggle-link" id="login-toggle-mode">Need an account? Register</button>
        </div>
        <div class="modal-actions">
          <button class="btn" id="login-cancel">Cancel</button>
          <button class="btn btn-primary" id="login-submit">Log In</button>
        </div>
      </div>
    </div>
  </body>
</html>
