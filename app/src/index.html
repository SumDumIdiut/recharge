<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recharge</title>
    <script src="/live-boot.js"></script>
    <script>
      // applied before any CSS paints, so there's no flash of the wrong colors.
      // Mirrors applyColors() in theme.js - duplicated here since this has to
      // run synchronously, before the module graph has a chance to load.
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem('rechargeColors'));
          if (!c || !c.bg) return;
          function hex(h) {
            var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h || '');
            return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [0, 0, 0];
          }
          function rgba(h, a) { var v = hex(h); return 'rgba(' + v[0] + ', ' + v[1] + ', ' + v[2] + ', ' + a + ')'; }
          var s = document.documentElement.style;
          s.setProperty('--bg', c.bg);
          s.setProperty('--panel', c.panel);
          s.setProperty('--text', c.text);
          s.setProperty('--text-dim', rgba(c.text, 0.55));
          s.setProperty('--line', rgba(c.text, 0.14));
          s.setProperty('--line-hi', rgba(c.text, 0.4));
          s.setProperty('--grid-line', rgba(c.text, 0.035));
          s.setProperty('--green', c.accent);
          s.setProperty('--green-dim', rgba(c.accent, 0.6));
          s.setProperty('--magenta', c.accent2);
          s.setProperty('--magenta-dim', rgba(c.accent2, 0.6));
          var v = hex(c.bg);
          s.colorScheme = (v[0] * 299 + v[1] * 587 + v[2] * 114) / 1000 < 128 ? 'dark' : 'light';
        } catch (e) {}
        // Same reasoning as the colors above - applied synchronously so
        // there's no flash of the un-textured/un-customized page.
        try {
          var tex = localStorage.getItem('rechargeBgTexture');
          if (tex) document.documentElement.style.setProperty('--bg-image', 'url("' + tex + '")');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/mods/style.css" />
    <link rel="stylesheet" href="/maps/style.css" />
    <link rel="stylesheet" href="/skins/style.css" />
    <link rel="stylesheet" href="/account/style.css" />
    <link rel="stylesheet" href="/settings/style.css" />
    <link rel="stylesheet" href="/credits/style.css" />
    <script type="module" src="/app.js" defer></script>
    <style id="recharge-custom-css"></style>
    <script>
      // Last in <head> (after every stylesheet above) so custom CSS can
      // freely override anything at equal specificity - the normal CSS
      // cascade already gives it priority by source order alone.
      (function () {
        try {
          var css = localStorage.getItem('rechargeCustomCss');
          if (css) document.getElementById('recharge-custom-css').textContent = css;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="bg-grid"></div>

    <div class="crumb-bar" id="crumb-bar" hidden>
      <button class="crumb-back" onclick="goHome()">
        Main Menu
      </button>
    </div>

    <div class="view v-on" id="view-home">
      <div class="home-page">
        <div class="home-header">
          <div class="home-title-row">
            <div class="home-title-left">
              <img class="home-logo" src="/assets/logo.png" alt="" />
              <span class="home-title">Recharge</span>
            </div>
            <button class="home-account-badge" id="home-account-badge" onclick="window.__homeAccountBadgeClick()">Log In</button>
          </div>
          <div id="wave-banner">
            <svg height="44" class="wave-trace">
              <polyline fill="none" />
            </svg>
          </div>
        </div>

        <div class="home-grid">
          <div class="home-panel">
            <div class="home-panel-title">Installation</div>
            <div class="home-install-list" id="home-install-list">
              <div class="home-install-sub">Detecting…</div>
            </div>
          </div>

          <div class="home-menu-col">
            <div class="home-launch-row">
              <button class="home-tile" onclick="window.__homeLaunch('vanilla')">
                <span>&gt; Vanilla</span>
              </button>
              <button class="home-tile" id="home-modded-tile" onclick="window.__homeLaunch('modded')">
                <span>&gt; Modded</span>
              </button>
            </div>
            <div class="home-play-status" id="home-play-status"></div>
            <div class="home-install-sub" id="home-demo-note" style="display:none;">The demo only supports vanilla - mods aren't available on it.</div>

            <button class="home-menu-row" id="home-mods-row" onclick="navigate('mods')">
              <span>&gt; Mods</span>
            </button>
            <button class="home-menu-row" id="home-maps-row" onclick="navigate('maps')">
              <span>&gt; Maps</span>
            </button>
            <button class="home-menu-row" id="home-skins-row" onclick="navigate('skins')">
              <span>&gt; Skins</span>
            </button>
            <button class="home-menu-row" onclick="navigate('settings')">
              <span>&gt; Settings</span>
            </button>
            <button class="home-menu-row" onclick="navigate('credits')">
              <span>&gt; Credits</span>
            </button>
          </div>

          <div class="home-panel home-log-panel">
            <div class="home-panel-title">Activity</div>
            <div class="home-log" id="home-log"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="view" id="view-mods"></div>
    <div class="view" id="view-maps"></div>
    <div class="view" id="view-skins"></div>
    <div class="view" id="view-account"></div>
    <div class="view" id="view-settings"></div>
    <div class="view" id="view-credits"></div>

    <div id="toast-container"></div>

    <button class="global-progress" id="global-progress" onclick="navigate('settings')" hidden>
      <div class="global-progress-text" id="global-progress-text"></div>
      <div class="progress-track"><div class="progress-fill" id="global-progress-fill"></div></div>
    </button>

    <div class="mods-modal-overlay" id="onboard-overlay" hidden>
      <div class="mods-modal">
        <div class="mods-modal-title">Get Set Up</div>
        <div class="mods-modal-body" id="onboard-body"></div>
        <div class="mods-modal-actions">
          <button class="btn" id="onboard-dismiss">Not Now</button>
          <button class="btn btn-primary" id="onboard-go">Go to Settings</button>
        </div>
      </div>
    </div>

    <div class="mods-modal-overlay" id="update-overlay" hidden>
      <div class="mods-modal">
        <div class="mods-modal-title">Update Available</div>
        <div class="mods-modal-body" id="update-body"></div>
        <div id="update-progress" class="settings-sub" hidden></div>
        <div class="mods-modal-actions">
          <button class="btn" id="update-later">Later</button>
          <button class="btn btn-primary" id="update-now">Update Now</button>
        </div>
      </div>
    </div>

    <div class="mods-modal-overlay" id="login-overlay" hidden>
      <div class="mods-modal">
        <div class="mods-modal-title" id="login-title">Log In</div>
        <div class="mods-modal-body">
          <label class="skins-upload-label">
            Username
            <input class="skins-upload-input" id="login-username" type="text" />
          </label>
          <label class="skins-upload-label">
            Password
            <input class="skins-upload-input" id="login-password" type="password" />
          </label>
          <div class="account-error" id="login-error" hidden></div>
          <button class="account-toggle-link" id="login-toggle-mode">Need an account? Register</button>
        </div>
        <div class="mods-modal-actions">
          <button class="btn" id="login-cancel">Cancel</button>
          <button class="btn btn-primary" id="login-submit">Log In</button>
        </div>
      </div>
    </div>
  </body>
</html>
