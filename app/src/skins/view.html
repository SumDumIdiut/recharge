<main class="page">
  <div id="skins-list">
  <div class="page-header">Skins</div>

  <div class="browser-toolbar">
    <div class="browser-subtabs">
      <button class="subtab-btn active" data-subtab="installed" onclick="window.__skinsSubtab('installed')">Installed</button>
      <button class="subtab-btn" data-subtab="browse" onclick="window.__skinsSubtab('browse')">Browse</button>
      <button class="subtab-btn" onclick="window.__skinExportTemplate()">Export Template</button>
      <button class="subtab-btn" id="skins-upload-btn" onclick="window.__skinOpenUpload()" style="display:none;">Upload</button>
    </div>
    <input class="browser-search" id="skins-search" type="text" placeholder="Search skins…" oninput="window.__skinsSearch(this.value)" />
  </div>

  <div id="skins-installed-view" class="browser-grid"></div>
  <div id="skins-browse-view" class="browser-grid" style="display:none;"></div>
  </div>

  <div id="skins-detail" style="display:none;"></div>
</main>

<div class="modal-overlay" id="skins-upload-overlay" hidden>
  <div class="modal">
    <div class="modal-title">Upload a Skin</div>
    <div class="modal-body">
      <label class="form-field">
        Skin folder
        <div class="form-browse-row">
          <span class="form-browse-path" id="skins-upload-path">No folder chosen</span>
          <button class="btn" id="skins-upload-browse-btn" type="button">Browse…</button>
        </div>
      </label>
      <label class="form-field">
        Name
        <input class="form-input" id="skins-upload-name" type="text" placeholder="e.g. Googly Eyes" />
      </label>
      <label class="form-field">
        Description
        <textarea class="form-input" id="skins-upload-description" rows="3" style="resize: vertical; font: inherit;" placeholder="Optional"></textarea>
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn" id="skins-upload-cancel">Cancel</button>
      <button class="btn btn-primary" id="skins-upload-confirm">Upload</button>
    </div>
  </div>
</div>
